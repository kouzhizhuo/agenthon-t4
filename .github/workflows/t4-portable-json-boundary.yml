name: T4 portable source and model JSON boundary controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Materialize pinned native sources and additive portable test
        run: |
          cat > portable.b64 <<'PAYLOAD'
          
          PAYLOAD
          python3 -I -S -B - <<'MATERIALIZE'
          import base64,gzip,hashlib,io,pathlib,tarfile
          raw=base64.b64decode(pathlib.Path('portable.b64').read_text());assert hashlib.sha256(raw).hexdigest()=='ce3b02ead009c2f568c93f67476b6cb5fc28eed1456c51c519e88ee0d8898e5c'
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw))) as tar:
           for m in tar.getmembers():
            p=pathlib.PurePosixPath(m.name);assert m.isfile() and not p.is_absolute() and '..' not in p.parts
            q=pathlib.Path('payload')/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(tar.extractfile(m).read())
          MATERIALIZE
      - name: Run portable controls on exact Python 3.13 final native image
        run: |
          set -euo pipefail
          image=ghcr.io/kouzhizhuo/agenthon-t4@sha256:cd4c53ae801cce08448de675005f6de959e22e048cb0c0ab3ddcddc5f2161173
          mkdir -p results
          chmod 777 results
          container=t4-portable-${{ github.run_id }}-${{ github.run_attempt }}
          trap 'timeout --kill-after=2s 20s docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 120s docker pull "$image" >pull.txt 2>&1
          status=0
          timeout --kill-after=5s 180s docker run --name "$container" --rm --pull never --network none -v "$PWD/payload:/test:ro" -v "$PWD/results:/results:rw" --entrypoint /usr/local/bin/python "$image" -I -S -B /test/portable/test_portable.py --source /test/candidates/native --out /results/portable >stdout.txt 2>stderr.txt || status=$?
          timeout --kill-after=2s 20s docker rm -f "$container" >cleanup.txt 2>&1 || true
          inspect_status=0
          timeout --kill-after=2s 10s docker container inspect "$container" >inspect.txt 2>&1 || inspect_status=$?
          inspect_text=$(cat inspect.txt)
          if ! test "$inspect_status" -eq 1 || ! [[ "$inspect_text" == *"No such"* && "$inspect_text" == *"$container"* ]]; then status=1; fi
          printf '%s\n' "$status" >exitcode.txt
          cat stderr.txt inspect.txt exitcode.txt
          test "$status" -eq 0
      - name: Allow artifact reader to read only invented results
        if: always()
        run: |
          if test -d "$GITHUB_WORKSPACE/results"; then sudo -n chmod -R a+rX -- "$GITHUB_WORKSPACE/results"; fi
      - name: Upload portable receipts and preserved failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-portable-json-${{ github.run_id }}
          path: |
            results
            pull.txt
            stdout.txt
            stderr.txt
            cleanup.txt
            inspect.txt
            exitcode.txt
          retention-days: 7
