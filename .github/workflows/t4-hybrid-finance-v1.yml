name: T4 hybrid financial arithmetic exact image and Linux checks
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Unpack exact frozen source, image and invented controls
        run: |
          set -euo pipefail
          mkdir -p payload results
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,pathlib,tarfile
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='ac3466a69fdbb1a2d33f7ee2b691c9b7dbbc4388c62f39a52deb644b804674e4'
          root=pathlib.Path('payload')
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw))) as archive:
              seen=set()
              for item in archive.getmembers():
                  path=pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts and item.name not in seen
                  seen.add(item.name)
                  target=root/item.name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(item).read())
          inventory=json.loads((root/'PAYLOAD_INVENTORY.json').read_bytes())
          assert seen=={r['path'] for r in inventory['files']}|{'PAYLOAD_INVENTORY.json'}
          for row in inventory['files']:
              data=(root/row['path']).read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          PY
      - name: Publish exact locally assembled immutable image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -S -B payload/tools/publish_oci.py --layout payload/image.oci --digest sha256:4ee7b34766893893834d04d4362442a7cbbb3c85e09e97d72d9f23e2c126f7a4 --tag v2-missing-tables-20261009-hybrid-finance-20261010 --base-pin payload/PUBLICATION_INPUT.json --report results/PUBLICATION.json
      - name: Anonymous digest pull with empty Docker configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t4-minimal-b-anonymous"
          test ! -e "$RUNNER_TEMP/t4-minimal-b-anonymous/config.json"
          timeout --kill-after=5s 120s docker --config "$RUNNER_TEMP/t4-minimal-b-anonymous" pull ghcr.io/kouzhizhuo/agenthon-t4@sha256:4ee7b34766893893834d04d4362442a7cbbb3c85e09e97d72d9f23e2c126f7a4 >results/anonymous-pull.txt 2>&1
          cat results/anonymous-pull.txt
      - name: Install pinned host-only validator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/t4-minimal-b-schema"
          "$RUNNER_TEMP/t4-minimal-b-schema/bin/python" -m pip install --disable-pip-version-check jsonschema==4.25.1 numpy==2.3.5
      - name: Run actual installed-image CLI and official deterministic subset
        run: |
          set -euo pipefail
          sudo -n "$RUNNER_TEMP/t4-minimal-b-schema/bin/python" -I -B payload/tools/verify_linux_minimal_b_v3.py --image ghcr.io/kouzhizhuo/agenthon-t4@sha256:4ee7b34766893893834d04d4362442a7cbbb3c85e09e97d72d9f23e2c126f7a4 --source payload/source --official payload/official --schema payload/official/analysis.schema.json --out results/hybrid >results/check.stdout.txt 2>results/check.stderr.txt
      - name: Make invented result receipts readable
        if: always()
        run: |
          if test -d "$GITHUB_WORKSPACE/results"; then sudo -n chmod -R a+rX -- "$GITHUB_WORKSPACE/results"; fi
      - name: Upload exact source and all result receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-hybrid-finance-linux-${{ github.run_id }}
          path: |
            results
            payload
          if-no-files-found: error
