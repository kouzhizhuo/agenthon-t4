name: T4 V75 exact reviewed EPS interface image and Linux checks
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: t4-v75-exact-image
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Unpack exact reviewed V75 runtime17 and immutable OCI delta
        env:
          EXPECTED_REPOSITORY: kouzhizhuo/agenthon-t4
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          mkdir -p payload results
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,pathlib,tarfile
          raw=base64.b64decode('',validate=True)
          assert hashlib.sha256(raw).hexdigest()=='d8df9f015f4711aa934829e9a0c182f59d8b653a94e827121e91dc9ea149a3ad'
          root=pathlib.Path('payload')
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw))) as archive:
              seen=set()
              for item in archive.getmembers():
                  path=pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts and item.name not in seen
                  assert not any(part.startswith('._') for part in path.parts)
                  seen.add(item.name)
                  target=root/item.name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.extractfile(item).read())
          inventory=json.loads((root/'PAYLOAD_INVENTORY.json').read_bytes())
          assert seen=={r['path'] for r in inventory['files']}|{'PAYLOAD_INVENTORY.json'}
          for row in inventory['files']:
              data=(root/row['path']).read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          PY
      - name: Publish exact offline assembled immutable V75 image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -S -B payload/tools/publish_oci.py --layout payload/image.oci --digest sha256:6c2b50fa4595b5c1ee4d86397597f46b3a3d88adb650f4e68a31ff82d3438ad8 --tag v2-missing-tables-20261009-v75-eps-interface-20261010 --base-pin payload/PUBLICATION_INPUT.json --report results/PUBLICATION.json
      - name: Anonymous exact digest pull with empty Docker configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t4-v75-anonymous"
          test ! -e "$RUNNER_TEMP/t4-v75-anonymous/config.json"
          timeout --kill-after=5s 120s docker --config "$RUNNER_TEMP/t4-v75-anonymous" pull ghcr.io/kouzhizhuo/agenthon-t4@sha256:6c2b50fa4595b5c1ee4d86397597f46b3a3d88adb650f4e68a31ff82d3438ad8 >results/anonymous-pull.txt 2>&1
          cat results/anonymous-pull.txt
      - name: Install pinned host-only official validator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/t4-v75-schema"
          "$RUNNER_TEMP/t4-v75-schema/bin/python" -m pip install --disable-pip-version-check jsonschema==4.25.1 numpy==2.3.5
      - name: Run actual installed V75 CLI, source17, EPS index and deterministic official controls
        run: |
          set -euo pipefail
          sudo -n "$RUNNER_TEMP/t4-v75-schema/bin/python" -I -B payload/tools/verify_linux_v75.py --image ghcr.io/kouzhizhuo/agenthon-t4@sha256:6c2b50fa4595b5c1ee4d86397597f46b3a3d88adb650f4e68a31ff82d3438ad8 --source payload/source --official payload/official --schema payload/official/analysis.schema.json --out results/hybrid >results/check.stdout.txt 2>results/check.stderr.txt
      - name: Make result receipts readable
        if: always()
        run: |
          if test -d "$GITHUB_WORKSPACE/results"; then sudo -n chmod -R a+rX -- "$GITHUB_WORKSPACE/results"; fi
      - name: Upload exact source, image delta and all success or failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-v75-eps-interface-linux-${{ github.run_id }}
          path: |
            results
            payload
          if-no-files-found: error
