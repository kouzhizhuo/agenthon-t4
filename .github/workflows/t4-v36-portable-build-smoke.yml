name: T4 V36 portable exact Linux build and offline CLI smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-smoke-publish-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_IMAGE: docker.io/library/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
      IMAGE_NAME: ghcr.io/kouzhizhuo/agenthon-t4
    steps:
      - name: Materialize exact hash-sealed source and review bundle
        run: |
          set -euo pipefail
          python3 - <<'PY_BUNDLE'
          import base64, hashlib, json, zlib
          from pathlib import Path, PurePosixPath
          COMPRESSED_B64 = ''
          EXPECTED = {".dockerignore":{"bytes":40,"sha256":"ff9fb912537678039fb2446b33c2e198a2b13a8787ec8f0921878bdc10ce5476"},"Dockerfile":{"bytes":741,"sha256":"442a1205387fe7ddc79456a0cdd303f40cc6656bb1ce5f4946084c24effc1de7"},"candidate/AUTHOR_SOURCE_VALIDATION.json":{"bytes":1239,"sha256":"f57e7869920074cdf36c68057104e2a10969e6900474d5b28ea2b7b75bd0880b"},"candidate/PORTABILITY.patch":{"bytes":6514,"sha256":"d20a53f52f784718628dd730ef6caa748f52452e838b783b3e37bec39d60fb1b"},"candidate/PRODUCTION_MECHANICS_PROTOCOL.json":{"bytes":3552,"sha256":"dc6794c175facf05fae37c9aba34152ac49bfd00394c3579ae9fc8403504d136"},"candidate/README.md":{"bytes":1266,"sha256":"78721f3a988cdc0fe321b8acc67101c2461d873647f04f96e3b7516fd5730a42"},"candidate/RUNTIME_MANIFEST.json":{"bytes":2902,"sha256":"c6f142d12b9c2be410950d3ee94872d8ee9a9c280bc4a59f7ca1a7019eed7fa4"},"candidate/SOURCE_FREEZE.json":{"bytes":4459,"sha256":"0fc9f9946cf510033fe39641f479184c24fad8fd56ae8dc24da225edf298a4b2"},"candidate/SOURCE_ORIGINS.json":{"bytes":6674,"sha256":"fb487cd75a5816bb4ad092eb4d2e50014ec436683b61bfc91e1c7f30942bea84"},"candidate/bundle.py":{"bytes":2927,"sha256":"743848f785e8b7c62dd1a0c4eae959c66af0aac9ef88f405eecca71d38a062b3"},"candidate/house_analyze.py":{"bytes":7255,"sha256":"f11a92cd13d63f53307b8ddde42b608952772264ffb4aa95860e47f9986e4e41"},"candidate/incumbent_v2/analyze.py":{"bytes":22867,"sha256":"24f50b7ecd20257d48e709a4e554848cefac6819d8b63fa7aa5b6552637b656e"},"candidate/incumbent_v2/house_analyze.py":{"bytes":18259,"sha256":"f9c544ee2a707ca7778f9b838855afb5037eca4f8e3103c84cec42cbdbeaac9d"},"candidate/v32/DEFAULT_CONFIG.json":{"bytes":1232,"sha256":"73f4ea92b04466e97aa0ca8bfd013ab4541ed20e89699ef3ee5eae5b59642906"},"candidate/v32/SOURCE_FREEZE.json":{"bytes":1340,"sha256":"98eed3abd548d12eb67ec370bf50d21854bd333562d7430e8cd32e5bee240879"},"candidate/v32/adapter.py":{"bytes":47835,"sha256":"5493d08373ebdb778919e7a265106d8c625e0510da48a8b2041b221c32b5dfd6"},"candidate/v32/auction_native.py":{"bytes":19527,"sha256":"dbabd7b661d0c10bb16c50dda5356138d60f27e5fbc51889baa0a5243df8e7af"},"candidate/v32/bank_selector.py":{"bytes":12239,"sha256":"c1cc0a6c7ebcb7d744b819008329ab3c8f3a70b4709e003477dcd615fa9b104f"},"candidate/v32/curve_context.py":{"bytes":5310,"sha256":"e5e106f50dbf82f0a48cb0ecb71223d96258ae23f9a2bbeb3359f785ed2f3275"},"candidate/v32/exact_v2/analyze.py":{"bytes":22867,"sha256":"24f50b7ecd20257d48e709a4e554848cefac6819d8b63fa7aa5b6552637b656e"},"candidate/v32/exact_v2/house_analyze.py":{"bytes":18259,"sha256":"f9c544ee2a707ca7778f9b838855afb5037eca4f8e3103c84cec42cbdbeaac9d"},"candidate/v32/task_native.py":{"bytes":10682,"sha256":"77487817273d04e519ea9908323ff4f44792940acc6e7041b5f792603c0d5841"},"candidate/v34/curve_core.py":{"bytes":15039,"sha256":"d7a6eb90aa2715d3c551df4f7d46407560e2da2c05f8538eb575b3512a15f31d"},"candidate/v34/prompt_bridge.py":{"bytes":7147,"sha256":"a145be0a74ebec841580029c46882e5ea31756316f39cb7f4313c6b6c810d871"},"candidate/v36/PROTOCOL.json":{"bytes":1619,"sha256":"a4bc68f4c8c84b92f7ec7c7b766d3343b9ab53ad48867b26da97edff860a86ae"},"candidate/v36/reason_binding.py":{"bytes":25466,"sha256":"033c0182131490e7302b1c497bdbf69c3c029244c20afc99558370d05bb6c2b3"},"candidate/v36/runtime_integration.py":{"bytes":5166,"sha256":"14afbd81c88f52786ff99a73309e1d185ca84dd3f23862f4a5e377cfce920990"},"provenance/PROVENANCE.json":{"bytes":2396,"sha256":"ae68edfe18de14fb7217ba33b8759b8c274bd7316f622cb0da24a73122f8ad59"},"provenance/candidate_review.json":{"bytes":6822,"sha256":"f2ed37f34642098e5c585b9e2deac13311fe25ec758f810dd95fbb7d3e19d181"},"provenance/candidate_review_freeze.json":{"bytes":1113,"sha256":"26a432cdb880516aca26fcdfbf226de55859a7cdce7670ca938924c516741b70"},"provenance/mechanics/AUTHOR_SOURCE_VALIDATION.json":{"bytes":971,"sha256":"4519434b68f21d39324e8e67efa9e5efc643a0aaf482fcf2612757d5739ba8ac"},"provenance/mechanics/CHANGE.patch":{"bytes":745,"sha256":"81718ec546cea14d117acc151709838d51f165510f273509a01e2f669defa51f"},"provenance/mechanics/PROTOCOL.json":{"bytes":2773,"sha256":"b07979fe9a4ea511afe3b3d20c0c48076dbe3ae4ac29a8eff819cd737edccc66"},"provenance/mechanics/README.md":{"bytes":1796,"sha256":"ec0cc92337f00f7ca97e231c8b291209456f600d4a6160f014bae4686df4971a"},"provenance/mechanics/RUN_GATE_PROPOSAL.json":{"bytes":1941,"sha256":"f42d8a3db47b7a310cd1a1ec4b73d200bca3d2a747790602b31024ffb9d45090"},"provenance/mechanics/SAVED_FAILURE_DIAGNOSIS.json":{"bytes":2862,"sha256":"d44f34181795e4662a7d0fd342322caed54a5299be64d6e7139e820ff57bff0f"},"provenance/mechanics/SOURCE_FREEZE.json":{"bytes":2923,"sha256":"2edadccf84f8186970866f3007e5298584521e92af5664df6d28544f66eb14fb"},"provenance/mechanics/comparator_cli.py":{"bytes":822,"sha256":"188d25b3e20a07a8a02ee112b23c22df5de1f1cae91084532c00c83abca1c6ce"},"provenance/mechanics/controls.py":{"bytes":21557,"sha256":"e8da9be51ad9fbb1f72385b8538c1b818b6d6fc2bb8f7ea2c6fead8664d35b5f"},"provenance/mechanics/launch_once.py":{"bytes":11506,"sha256":"70d7e55a6b57351187e81976065a215e58eb142f196a139794de695fc14c14a6"},"provenance/mechanics_amendment_review.json":{"bytes":1854,"sha256":"1dc1201bb912124df94063d7909775976e369c663fed6f5558abb521e1130298"},"provenance/mechanics_amendment_review_freeze.json":{"bytes":1297,"sha256":"bc8be9323594c643d6d1d5300bd350211a6355922b22baabc9e3467fc30afc21"},"verification/comparator_cli.py":{"bytes":822,"sha256":"188d25b3e20a07a8a02ee112b23c22df5de1f1cae91084532c00c83abca1c6ce"},"verification/controls.py":{"bytes":21557,"sha256":"e8da9be51ad9fbb1f72385b8538c1b818b6d6fc2bb8f7ea2c6fead8664d35b5f"},"verification/verify_installed.py":{"bytes":4933,"sha256":"5cee4634740d170cc5fe05236f0fd1868c18a6febbe2a80f7a65d2a7a456ec9e"},"verification/verify_smoke.py":{"bytes":5068,"sha256":"fc6ae03d6bc6dd40c054d8dd12a78d87fa6ab723ac98b95ffc561f3c1107eac9"}}
          COMPRESSED_BYTES = 156398
          COMPRESSED_SHA = '6e5c4a3b6b1a7ce825730713d6c68d9e4ef19870caf574e6142a76306b79c353'
          DECODED_BYTES = 490054
          DECODED_SHA = '633a81504ff895296c4e626dbfc8b327b30f777b0a573190e921b4ca515bbdf1'
          
          def strict(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result: raise ValueError('duplicate embedded JSON key')
                      result[key] = value
                  return result
              return json.loads(raw, object_pairs_hook=pairs)
          compressed = base64.b64decode(COMPRESSED_B64, validate=True)
          assert len(compressed) == COMPRESSED_BYTES and hashlib.sha256(compressed).hexdigest() == COMPRESSED_SHA
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = decoder.decompress(compressed, DECODED_BYTES + 1)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(raw) == DECODED_BYTES and hashlib.sha256(raw).hexdigest() == DECODED_SHA
          payload = strict(raw)
          assert set(payload) == set(EXPECTED)
          validated = {}
          for relative, value in payload.items():
              path = PurePosixPath(relative)
              assert relative and not path.is_absolute() and str(path) == relative and '..' not in path.parts
              assert not any(part.startswith('._') or part in ('.', '__pycache__') for part in path.parts)
              body = base64.b64decode(value, validate=True)
              assert len(body) == EXPECTED[relative]['bytes'] and hashlib.sha256(body).hexdigest() == EXPECTED[relative]['sha256']
              validated[relative] = body
          freeze = strict(validated['candidate/SOURCE_FREEZE.json'])
          assert len(validated['candidate/SOURCE_FREEZE.json']) == 4459
          assert hashlib.sha256(validated['candidate/SOURCE_FREEZE.json']).hexdigest() == '0fc9f9946cf510033fe39641f479184c24fad8fd56ae8dc24da225edf298a4b2'
          assert len(freeze['files']) == 24 and len({row['path'] for row in freeze['files']}) == 24
          assert {name for name in validated if name.startswith('candidate/')} == {'candidate/' + row['path'] for row in freeze['files']} | {'candidate/SOURCE_FREEZE.json'}
          for row in freeze['files']:
              assert EXPECTED['candidate/' + row['path']] == {'bytes': row['bytes'], 'sha256': row['sha256']}
          root = Path('bundle'); root.mkdir()
          for relative, body in sorted(validated.items()):
              target = root / relative; target.parent.mkdir(parents=True, exist_ok=True)
              with target.open('xb') as stream: stream.write(body)
              target.chmod(0o444)
          print(json.dumps({'status': 'PASS_EXACT_MATERIALIZATION', 'files': len(validated), 'candidate_files': 25, 'runtime_executed': False}, sort_keys=True))
          PY_BUNDLE
      - name: Materialize post-container evidence preparation helper
        run: |
          set -euo pipefail
          python3 - <<'PY_EVIDENCE_HELPER'
          import base64
          from pathlib import Path
          raw = base64.b64decode('', validate=True)
          assert len(raw) == 4989
          import hashlib
          assert hashlib.sha256(raw).hexdigest() == '838dc1e2a2f204568019f458c54453ce354879370aab5fab9e81c3084607888c'
          with Path('prepare_smoke_evidence.py').open('xb') as stream:
              stream.write(raw)
          PY_EVIDENCE_HELPER
      - name: Build exact Linux amd64 candidate
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 300s docker pull "$BASE_IMAGE" > base-pull.txt
          docker image inspect "$BASE_IMAGE" > base-image-inspect.json
          timeout --kill-after=10s 300s docker build --network none --platform linux/amd64 --pull=false --tag t4-v36-portable:candidate bundle > build.txt
          docker image inspect t4-v36-portable:candidate > candidate-image-inspect.json
          python3 -I -S -B bundle/verification/verify_installed.py --image candidate-image-inspect.json > candidate-config-receipt.json
          python3 - <<'PY_ID'
          import json
          from pathlib import Path
          row = json.loads(Path('candidate-config-receipt.json').read_bytes())
          Path('CANDIDATE_IMAGE_ID.txt').write_text(row['image_id'] + '\n')
          PY_ID
      - name: Verify actual installed source and runtime
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          timeout --kill-after=10s 30s docker run --rm --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges -v "$PWD/bundle/verification:/verification:ro" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/verify_installed.py > installed-source-runtime.json
      - name: Eight fixed invented CLI controls in actual image
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          SMOKE_NAME="t4-v36-portable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir smoke-output
          chmod 0777 smoke-output
          trap 'timeout --kill-after=5s 30s docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true' EXIT
          docker create --name "$SMOKE_NAME" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges -v "$PWD/bundle/verification:/verification:ro" -v "$PWD/smoke-output:/output:rw" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/controls.py --candidate /app --out /output/mechanics > smoke-container-id.txt
          timeout --kill-after=5s 55s docker start -a "$SMOKE_NAME" > smoke-container-stdout.txt 2> smoke-container-stderr.txt
          docker inspect "$SMOKE_NAME" > smoke-container-inspect.json
          python3 - <<'PY_EXIT'
          import json
          from pathlib import Path
          state = json.loads(Path('smoke-container-inspect.json').read_bytes())[0]['State']
          assert state['Status'] == 'exited' and state['ExitCode'] == 0 and not state['OOMKilled'] and not state['Error']
          PY_EXIT
          sudo python3 -I -S -B "$PWD/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase success --container-name "$SMOKE_NAME"
          python3 -I -S -B bundle/verification/verify_smoke.py --output smoke-output/mechanics --container smoke-container-inspect.json --image-id "$IMAGE_ID" > smoke-summary.json
          cat smoke-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish same verified image to unique candidate tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path
          image_id = Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          assert json.loads(Path('candidate-config-receipt.json').read_bytes())['image_id'] == image_id
          assert json.loads(Path('installed-source-runtime.json').read_bytes())['status'] == 'PASS_ACTUAL_INSTALLED_SOURCE_RUNTIME'
          smoke = json.loads(Path('smoke-summary.json').read_bytes())
          assert smoke['status'] == 'PASS_ACTUAL_IMAGE_MECHANICS8_AND_SETTLEMENT' and smoke['image_id'] == image_id
          PY_GATE
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u kouzhizhuo --password-stdin
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          TAG="v36-portable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE_ID" "$IMAGE_NAME:$TAG"
          timeout --kill-after=10s 300s docker push "$IMAGE_NAME:$TAG" > registry-push.txt
          docker image inspect "$IMAGE_NAME:$TAG" > published-image-inspect.json
          python3 - <<'PY_PUBLISH'
          import hashlib, json, os
          from pathlib import Path
          row = json.loads(Path('published-image-inspect.json').read_bytes())[0]
          image_id = Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          assert row['Id'] == image_id
          refs = [r for r in row['RepoDigests'] if r.startswith('ghcr.io/kouzhizhuo/agenthon-t4@sha256:')]
          assert len(refs) == 1
          provenance = json.loads(Path('bundle/provenance/PROVENANCE.json').read_bytes())
          provenance.update({'status': 'COMPLETE_VERIFIED_CANDIDATE_PUBLISHED', 'image': refs[0], 'image_id': image_id, 'tag': 'v36-portable-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'actual_image_mechanics_cases': 8, 'actual_CLI_processes': 11, 'synthetic_HTTP_requests': 17, 'build': 1, 'publication': 1, 'House_calls': 0, 'quality_gain_established': False, 'official_submission': False})
          files = []
          for p in sorted(Path('smoke-output').rglob('*')):
              if p.is_file():
                  raw = p.read_bytes(); files.append({'path': str(p), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          provenance['saved_smoke_files'] = files
          Path('PUBLISHED_CANDIDATE.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY_PUBLISH
      - name: Prepare partial smoke evidence for artifacts after container settlement
        if: always()
        run: |
          set -euo pipefail
          if [ -e smoke-output ]; then
            sudo python3 -I -S -B "$PWD/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase always --container-name "t4-v36-portable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Preserve source provenance and evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-v36-portable-linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            bundle/provenance
            base-pull.txt
            base-image-inspect.json
            build.txt
            candidate-image-inspect.json
            candidate-config-receipt.json
            CANDIDATE_IMAGE_ID.txt
            installed-source-runtime.json
            smoke-container-id.txt
            smoke-container-inspect.json
            smoke-container-stdout.txt
            smoke-container-stderr.txt
            smoke-output
            smoke-evidence-*.json
            smoke-summary.json
            registry-push.txt
            published-image-inspect.json
            PUBLISHED_CANDIDATE.json
