name: T4 V7 exact Linux build and full11 mechanical controls V2
on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the same verified mechanical candidate image
        type: boolean
        required: true
        default: false
      independent_review_sha256:
        description: Root-verified author-disjoint workflow source review SHA256
        type: string
        required: true
      context_saved_review_sha256:
        description: Root-verified disjoint exact V7 full11 saved context review SHA256
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_IMAGE: docker.io/library/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
      IMAGE_NAME: ghcr.io/kouzhizhuo/agenthon-t4
      WORKFLOW_REVIEW_SHA256: ${{ inputs.independent_review_sha256 }}
      CONTEXT_SAVED_REVIEW_SHA256: ${{ inputs.context_saved_review_sha256 }}
    steps:
      - name: Materialize exact lossless public-input and source payload
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s python3 -I -S -B - <<'PY_BUNDLE'
          import base64, hashlib, json, lzma, os, re, urllib.request
          from pathlib import Path, PurePosixPath
          for key in ('WORKFLOW_REVIEW_SHA256', 'CONTEXT_SAVED_REVIEW_SHA256'):
              if not re.fullmatch('[0-9a-f]{64}', os.environ[key]):
                  raise ValueError('root supplied exact disjoint workflow and V7 context review digests required')
          PAYLOAD_COMMIT = 'f53da46fadd170a69b0d19e86ab06f487bdd40b0'
          if not re.fullmatch('[0-9a-f]{40}', PAYLOAD_COMMIT):
              raise ValueError('immutable payload commit required')
          URL = ('https://raw.githubusercontent.com/kouzhizhuo/agenthon-t4/' +
                 PAYLOAD_COMMIT + '/verification/t4-v7-exact-payload.b85')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *unused):
                  raise ValueError('payload redirects refused')
          opener = urllib.request.build_opener(NoRedirect())
          with opener.open(urllib.request.Request(URL), timeout=15) as response:
              if response.status != 200 or response.geturl() != URL:
                  raise ValueError('exact public payload URL required')
              length = response.headers.get('Content-Length')
              if length is not None and int(length) != 1953571:
                  raise ValueError('exact payload content length required')
              encoded = response.read(1953572)
          assert len(encoded) == 1953571
          assert hashlib.sha256(encoded).hexdigest() == '82fb886f0df8cdf03466b55532ebc9ddb4008bc512604bbb74337c26498dfab3'
          assert encoded[-1:] == b'\n'
          encoded = encoded[:-1]
          assert len(encoded) == 1953570
          assert hashlib.sha256(encoded).hexdigest() == '823180b089b23d5975bffef5924a5c8382cd3095d44cf331d0223db2ebf1aee9'
          encoded.decode('ascii')
          packed = base64.b85decode(encoded)
          assert len(packed) == 1562856
          assert hashlib.sha256(packed).hexdigest() == 'e1dd12f06580bcd435b085914dca5fbfdb1d0cdd3c3f3a820951e188dae9dd0c'
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=256 * 1024 ** 2)
          raw = decoder.decompress(packed, max_length=9979479)
          assert len(raw) == 9979478 and decoder.eof and not decoder.unused_data
          assert hashlib.sha256(raw).hexdigest() == 'ca4113ca88c79a5e35c00d0e364c0cb43272d95924ad64011ef238c87090a346'
          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result: raise ValueError('duplicate payload field')
                  result[key] = value
              return result
          body = json.loads(raw, object_pairs_hook=pairs)
          assert body['schema'] == 't4-v7-selfcontained-exact-utf8-bundle-v1'
          assert set(body['files']) == set(body['inventory']) and len(body['files']) == 114
          root = Path('bundle'); root.mkdir()
          for name, text in body['files'].items():
              relative = PurePosixPath(name)
              if (relative.is_absolute() or str(relative) != name or '..' in relative.parts
                      or any(part.startswith('._') for part in relative.parts)):
                  raise ValueError('canonical unique bundle member required')
              raw_member = text.encode('utf-8'); member = body['inventory'][name]
              assert len(raw_member) == member['bytes'] and hashlib.sha256(raw_member).hexdigest() == member['sha256']
              path = root.joinpath(*relative.parts); path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as stream: stream.write(raw_member)
          for scope in ('inputs', 'verification'):
              for path in root.joinpath(scope).rglob('*'):
                  path.chmod(0o555 if path.is_dir() else 0o444)
              root.joinpath(scope).chmod(0o555)
          Path('WORKFLOW_REVIEW_SHA256.txt').write_text(os.environ['WORKFLOW_REVIEW_SHA256'] + '\n')
          Path('CONTEXT_SAVED_REVIEW_SHA256.txt').write_text(os.environ['CONTEXT_SAVED_REVIEW_SHA256'] + '\n')
          Path('ROOT_DISPATCH_ATTESTATION.json').write_text(json.dumps({
              'status': 'ROOT_SUPPLIED_REVIEW_ATTESTATION_ONLY',
              'payload_commit': PAYLOAD_COMMIT,
              'payload_encoded_sha256': '823180b089b23d5975bffef5924a5c8382cd3095d44cf331d0223db2ebf1aee9',
              'candidate_source_freeze_sha256': '7d0bfa1e610864ab1b823d73b50d3cde875c5be89242eda89017708da739152f',
              'workflow_independent_review_sha256': os.environ['WORKFLOW_REVIEW_SHA256'],
              'V7_context_saved_review_sha256': os.environ['CONTEXT_SAVED_REVIEW_SHA256'],
              'root_verification_required_before_dispatch': True,
              'digest_shape_is_execution_authorization': False}, sort_keys=True) + '\n')
          PY_BUNDLE
      - name: Build one exact Linux amd64 candidate
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 300s docker pull "$BASE_IMAGE" > base-pull.txt
          docker image inspect "$BASE_IMAGE" > base-image-inspect.json
          timeout --kill-after=10s 300s docker build --network none --platform linux/amd64 --pull=false --tag t4-v7-generic:candidate bundle > build.txt
          docker image inspect t4-v7-generic:candidate > candidate-image-inspect.json
          python3 -I -S -B bundle/verification/verify_installed.py --image candidate-image-inspect.json > candidate-config-receipt.json
          python3 -I -S -B - <<'PY_ID'
          import json
          from pathlib import Path
          row = json.loads(Path('candidate-config-receipt.json').read_bytes())
          Path('CANDIDATE_IMAGE_ID.txt').write_text(row['image_id'] + '\n')
          PY_ID
      - name: Verify actual installed source and restrictions
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          timeout --kill-after=5s 30s docker run --rm --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=2 --memory=1g --memory-swap=1g --pids-limit=64 -v "$PWD/bundle/verification:/verification:ro" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/verify_installed.py > installed-source-runtime.json
      - name: Full11 direct algebra fakeHTTP and fresh actualCLI controls
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          SMOKE_NAME="t4-v7-generic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir smoke-output
          chmod 0777 smoke-output
          trap 'timeout --kill-after=5s 30s docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true' EXIT
          docker create --name "$SMOKE_NAME" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=2 --memory=1g --memory-swap=1g --pids-limit=64 -v "$PWD/bundle/verification:/verification:ro" -v "$PWD/bundle/inputs:/inputs:ro" -v "$PWD/smoke-output:/output:rw" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/controls_once.py --out /output/mechanics > smoke-container-id.txt
          timeout --kill-after=5s 150s docker start -a "$SMOKE_NAME" > smoke-container-stdout.txt 2> smoke-container-stderr.txt
          docker inspect "$SMOKE_NAME" > smoke-container-inspect.json
          python3 -I -S -B - <<'PY_EXIT'
          import json
          from pathlib import Path
          state = json.loads(Path('smoke-container-inspect.json').read_bytes())[0]['State']
          assert state['Status'] == 'exited' and state['ExitCode'] == 0 and not state['OOMKilled'] and not state['Error']
          PY_EXIT
          sudo python3 -I -S -B "$PWD/bundle/verification/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase success --container-name "$SMOKE_NAME"
          python3 -I -S -B bundle/verification/verify_controls.py --output smoke-output/mechanics --container smoke-container-inspect.json --image-id "$IMAGE_ID" > smoke-summary.json
          cat smoke-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish only the same fully verified image when root requests it
        if: ${{ inputs.publish_candidate }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_GATE'
          import json
          from pathlib import Path
          image_id = Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          assert json.loads(Path('candidate-config-receipt.json').read_bytes())['image_id'] == image_id
          assert json.loads(Path('installed-source-runtime.json').read_bytes())['status'] == 'PASS_ACTUAL_INSTALLED_V7_SOURCE_RUNTIME'
          smoke = json.loads(Path('smoke-summary.json').read_bytes())
          assert smoke['status'] == 'PASS_ACTUAL_IMAGE_V7_FULL11_MECHANICAL181_CLI3_SETTLEMENT' and smoke['image_id'] == image_id
          PY_GATE
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u kouzhizhuo --password-stdin
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          TAG="v7-generic-mechanical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE_ID" "$IMAGE_NAME:$TAG"
          timeout --kill-after=10s 300s docker push "$IMAGE_NAME:$TAG" > registry-push.txt
          docker image inspect "$IMAGE_NAME:$TAG" > published-image-inspect.json
          python3 -I -S -B - <<'PY_PUBLISH'
          import json, os
          from pathlib import Path
          row = json.loads(Path('published-image-inspect.json').read_bytes())[0]
          image_id = Path('CANDIDATE_IMAGE_ID.txt').read_text().strip()
          assert row['Id'] == image_id
          refs = [ref for ref in row['RepoDigests'] if ref.startswith('ghcr.io/kouzhizhuo/agenthon-t4@sha256:')]
          assert len(refs) == 1
          provenance = json.loads(Path('bundle/provenance/PROVENANCE.json').read_bytes())
          provenance.update({'status': 'COMPLETE_VERIFIED_MECHANICAL_CANDIDATE_PUBLISHED', 'image': refs[0],
              'image_id': image_id, 'tag': 'v7-generic-mechanical-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_independent_review_sha256': os.environ['WORKFLOW_REVIEW_SHA256'],
              'V7_context_saved_review_sha256': os.environ['CONTEXT_SAVED_REVIEW_SHA256'],
              'build': 1, 'publication': 1, 'House_calls': 0, 'quality_gain_established': False, 'official_submission': False})
          Path('PUBLISHED_CANDIDATE.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY_PUBLISH
      - name: Preserve partial evidence ownership after container settlement
        if: always()
        run: |
          set -euo pipefail
          if [ -e smoke-output ]; then
            sudo python3 -I -S -B "$PWD/bundle/verification/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase always --container-name "t4-v7-generic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Preserve source provenance and mechanical evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-v7-generic-linux-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            bundle/provenance
            WORKFLOW_REVIEW_SHA256.txt
            CONTEXT_SAVED_REVIEW_SHA256.txt
            ROOT_DISPATCH_ATTESTATION.json
            base-pull.txt
            base-image-inspect.json
            build.txt
            candidate-image-inspect.json
            candidate-config-receipt.json
            CANDIDATE_IMAGE_ID.txt
            installed-source-runtime.json
            smoke-container-id.txt
            smoke-container-inspect.json
            smoke-container-stdout.txt
            smoke-container-stderr.txt
            smoke-output
            smoke-evidence-*.json
            smoke-summary.json
            registry-push.txt
            published-image-inspect.json
            PUBLISHED_CANDIDATE.json
