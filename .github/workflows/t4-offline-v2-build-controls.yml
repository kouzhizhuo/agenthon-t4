name: T4 corrected image and invented offline CLI controls
on:
  workflow_dispatch:
    inputs:
      candidate_source_review_sha256:
        description: Root-verified accepted author-disjoint exact offline V2 candidate source review SHA256
        required: true
        type: string
      workflow_source_review_sha256:
        description: Root-verified accepted author-disjoint exact workflow source review SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_IMAGE: docker.io/library/python@sha256:8fb4cfa1a2616d7b8e0c2175cc6ad68f5729c34ea8488c0b360d2934b7be9024
      CANDIDATE_REVIEW_SHA256: ${{ inputs.candidate_source_review_sha256 }}
      WORKFLOW_REVIEW_SHA256: ${{ inputs.workflow_source_review_sha256 }}
    steps:
      - name: Verify review references and exact embedded source payload
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY_REVIEW'
          import json, os, re
          from pathlib import Path
          for key in ('CANDIDATE_REVIEW_SHA256', 'WORKFLOW_REVIEW_SHA256'):
              if re.fullmatch('[0-9a-f]{64}', os.environ[key]) is None:
                  raise ValueError('root-verified exact review SHA256 inputs required')
          Path('ROOT_REVIEW_ATTESTATION.json').write_text(json.dumps({
              'candidate_review_sha256': os.environ['CANDIDATE_REVIEW_SHA256'],
              'workflow_review_sha256': os.environ['WORKFLOW_REVIEW_SHA256'],
              'candidate_source_freeze_sha256': 'ca35ded7e7c140a87ed02c52cb9537107f179a41461c1fd98d704c04a67ba2b8',
              'digest_shape_is_approval': False, 'root_source_review_required_before_dispatch': True,
              'House_calls': 0, 'submission': False}, sort_keys=True) + '\n')
          PY_REVIEW
          cat > PAYLOAD.b85 <<'PAYLOAD_B85_EXACT'
