          """Bounded embedded exact source payload reader; no candidate run."""
          import argparse
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path,PurePosixPath
          import re
          
          def main():
              parser=argparse.ArgumentParser();parser.add_argument('--commit',required=True);args=parser.parse_args()
              if re.fullmatch('[0-9a-f]{40}',args.commit) is None:raise ValueError('exact root-published immutable personal repository commit required')
              binding=json.loads(Path('PAYLOAD_BINDING.json').read_bytes())
              with Path('PAYLOAD.b85').open('rb') as stream:
                  body=stream.read(binding['encoded_bytes']+1)
              if len(body)!=binding['encoded_bytes'] or hashlib.sha256(body).hexdigest()!=binding['encoded_sha256']:raise ValueError('exact embedded payload bytes required')
              if body[-1:]!=b'\n':raise ValueError('exact payload line terminator')
              packed=base64.b85decode(body[:-1]);packed_pin=binding['packed']
              if len(packed)!=packed_pin['bytes'] or hashlib.sha256(packed).hexdigest()!=packed_pin['sha256']:raise ValueError('exact compressed source payload')
              decoder=lzma.LZMADecompressor(format=lzma.FORMAT_XZ,memlimit=64*1024*1024)
              raw=decoder.decompress(packed,max_length=binding['raw']['bytes']+1)
              if len(raw)!=binding['raw']['bytes'] or not decoder.eof or decoder.unused_data or hashlib.sha256(raw).hexdigest()!=binding['raw']['sha256']:raise ValueError('bounded exact decoded source payload')
              def pairs(items):
                  result={}
                  for key,value in items:
                      if key in result:raise ValueError('duplicate source payload JSON field')
                      result[key]=value
                  return result
              value=json.loads(raw,object_pairs_hook=pairs)
              if value['schema']!='t4-offline-v2-source-only-payload-v1' or set(value['files'])!=set(value['inventory']):raise ValueError('closed source payload required')
              root=Path('bundle');root.mkdir()
              for name,text in value['files'].items():
                  relative=PurePosixPath(name)
                  if relative.is_absolute() or str(relative)!=name or '..' in relative.parts or any(x.startswith('._') for x in relative.parts):raise ValueError('canonical source member required')
                  member=text.encode();expected=value['inventory'][name]
                  if len(member)!=expected['bytes'] or hashlib.sha256(member).hexdigest()!=expected['sha256']:raise ValueError('exact source payload member pin')
                  target=root.joinpath(*relative.parts);target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as stream:stream.write(member)
              for path in (root/'verification').rglob('*'):path.chmod(0o555 if path.is_dir() else 0o444)
              (root/'verification').chmod(0o555)
              Path('PAYLOAD_RECEIPT.json').write_text(json.dumps({'status':'EXACT_SOURCE_PAYLOAD_MATERIALIZED','commit':args.commit,'binding':binding,'candidate_execution':0},sort_keys=True)+'\n')
          
          if __name__=='__main__':main()
          MATERIALIZER_EXACT
          timeout --kill-after=5s 45s python3 -I -S -B materialize_payload.py --commit "$GITHUB_SHA" > payload-stdout.txt 2> payload-stderr.txt
      - name: Build exact corrected Linux amd64 image
        run: |
          set -euo pipefail
          mkdir anonymous-docker-config
          export DOCKER_CONFIG="$PWD/anonymous-docker-config"
          timeout --kill-after=10s 180s docker pull "$BASE_IMAGE" > base-pull-stdout.txt 2> base-pull-stderr.txt
          docker image inspect "$BASE_IMAGE" > base-image-inspect.json
          timeout --kill-after=10s 240s docker build --network none --platform linux/amd64 --pull=false --build-arg CANDIDATE_SOURCE_REVIEW_SHA256="$CANDIDATE_REVIEW_SHA256" --tag t4-offline-v2:candidate bundle > build-stdout.txt 2> build-stderr.txt
          docker image inspect t4-offline-v2:candidate > candidate-image-inspect.json
          python3 -I -S -B bundle/verification/verify_installed.py --image candidate-image-inspect.json --review-sha256 "$CANDIDATE_REVIEW_SHA256" > candidate-config-receipt.json
          python3 -I -S -B - <<'PY_ID'
          import json
          from pathlib import Path
          Path('CANDIDATE_IMAGE_ID.txt').write_text(json.loads(Path('candidate-config-receipt.json').read_bytes())['image_id'] + '\n')
          PY_ID
      - name: Verify installed exact twelve-member runtime and container restrictions
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          timeout --kill-after=5s 20s docker run --rm --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=2 --memory=1g --memory-swap=1g --pids-limit=32 -v "$PWD/bundle/verification:/verification:ro" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/verify_installed.py > installed-source-runtime.json 2> installed-source-stderr.txt
      - name: Run actual offline full roster CLI and finite typed controls
        run: |
          set -euo pipefail
          IMAGE_ID="$(cat CANDIDATE_IMAGE_ID.txt)"
          SMOKE_NAME="t4-offline-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir smoke-output
          chmod 0777 smoke-output
          docker create --name "$SMOKE_NAME" --pull never --platform linux/amd64 --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --cpus=2 --memory=1g --memory-swap=1g --pids-limit=32 -v "$PWD/bundle/verification:/verification:ro" -v "$PWD/smoke-output:/output:rw" --entrypoint /usr/local/bin/python "$IMAGE_ID" -I -S -B /verification/controls_once.py --out /output/mechanics > smoke-container-id.txt
          set +e
          timeout --kill-after=5s 75s docker start -a "$SMOKE_NAME" > smoke-stdout.txt 2> smoke-stderr.txt
          RUN_CODE=$?
          set -e
          docker inspect "$SMOKE_NAME" > smoke-container-inspect.json
          timeout --kill-after=5s 10s docker rm -f "$SMOKE_NAME" > smoke-container-cleanup.txt 2>&1
          if [ "$RUN_CODE" -ne 0 ]; then exit "$RUN_CODE"; fi
          python3 -I -S -B - <<'PY_VERIFY'
          import json
          from pathlib import Path
          state = json.loads(Path('smoke-container-inspect.json').read_bytes())[0]['State']
          assert state['Status'] == 'exited' and state['ExitCode'] == 0 and not state['OOMKilled'] and not state['Error']
          result = json.loads(Path('smoke-output/mechanics/CONTROLS_RECEIPT.json').read_bytes())
          assert result['status'] == 'PASS_ACTUAL_LINUX_OFFLINE_V2_INVENTED_CLI_AND_TYPED_CONTROLS'
          assert len(result['runs']) == 18 and len(result['checks']) == 30
          assert all(row['pass'] for row in result['checks'])
          assert result['actual_public_raw_inputs'] == result['House_calls'] == result['network_calls'] == 0
          Path('LINUX_INVENTED_CONTROL_VERDICT.json').write_text(json.dumps(result, sort_keys=True) + '\n')
          PY_VERIFY
      - name: Settle current owned smoke container on failure and preserve evidence
        if: always()
        run: |
          set -euo pipefail
          SMOKE_NAME="t4-offline-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$SMOKE_NAME" > cleanup-before-inspect.json 2> cleanup-inspect-stderr.txt; then
            timeout --kill-after=5s 10s docker rm -f "$SMOKE_NAME" > cleanup-remove.txt 2>&1
          fi
          if [ -d smoke-output ]; then
            sudo python3 -I -S -B "$PWD/bundle/verification/prepare_smoke_evidence.py" --uid "$(id -u)" --gid "$(id -g)" --phase always --container-name "$SMOKE_NAME"
          fi
      - name: Upload build and controls including failed stages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-offline-v2-linux-source-and-controls-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            bundle/provenance
            ROOT_REVIEW_ATTESTATION.json
            PAYLOAD_BINDING.json
            PAYLOAD_RECEIPT.json
            payload-*.txt
            base-pull-*.txt
            base-image-inspect.json
            build-*.txt
            candidate-image-inspect.json
            candidate-config-receipt.json
            CANDIDATE_IMAGE_ID.txt
            installed-source-runtime.json
            installed-source-stderr.txt
            smoke-*.txt
            smoke-container-inspect.json
            smoke-output
            cleanup-*.json
            cleanup-*.txt
            smoke-evidence-*.json
            LINUX_INVENTED_CONTROL_VERDICT.json
