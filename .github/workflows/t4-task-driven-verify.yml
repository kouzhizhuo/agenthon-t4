name: T4 task-driven native and ensemble final image verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Materialize exact public candidate sources
        run: |
          cat > payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          python3 -I -S -B - <<'MATERIALIZE'
          import base64,gzip,hashlib,io,pathlib,tarfile
          raw=base64.b64decode(pathlib.Path('payload.b64').read_text());assert hashlib.sha256(raw).hexdigest()=='94527736f4e7b96fb585e2e0a407ba32b9bb5547034ac6b5aca29d3604aec677'
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw))) as tar:
           for m in tar.getmembers():
            p=pathlib.PurePosixPath(m.name);assert m.isfile() and not p.is_absolute() and '..' not in p.parts
            q=pathlib.Path('payload')/p;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(tar.extractfile(m).read())
          MATERIALIZE
      - name: Verify candidate source controls on Python 3.13 final image
        run: |
          set -euo pipefail
          mkdir -p results/source-controls
          native_image=ghcr.io/kouzhizhuo/agenthon-t4@sha256:cd4c53ae801cce08448de675005f6de959e22e048cb0c0ab3ddcddc5f2161173
          ensemble_image=ghcr.io/kouzhizhuo/agenthon-t4@sha256:403f989984c2e23def605f382fbe83e5c5f5933d2d38249006e7e718822f2a98
          native_container=t4-native-controls-${{ github.run_id }}-${{ github.run_attempt }}
          ensemble_container=t4-ensemble-controls-${{ github.run_id }}-${{ github.run_attempt }}
          trap 'timeout --kill-after=2s 20s docker rm -f "$native_container" "$ensemble_container" >/dev/null 2>&1 || true' EXIT
          cleanup_control() {
            control_name=$1
            control_prefix=$2
            timeout --kill-after=2s 20s docker rm -f "$control_name" >"$control_prefix.cleanup.txt" 2>&1 || true
            inspect_status=0
            timeout --kill-after=2s 10s docker container inspect "$control_name" >"$control_prefix.inspect.txt" 2>&1 || inspect_status=$?
            test "$inspect_status" -eq 1 || return 1
            inspect_text=$(cat "$control_prefix.inspect.txt")
            [[ "$inspect_text" == *"No such"* && "$inspect_text" == *"$control_name"* ]]
          }
          native_status=0
          ensemble_status=0
          timeout --kill-after=5s 120s docker pull "$native_image" >results/source-controls/native.pull.txt 2>&1 || native_status=$?
          timeout --kill-after=5s 120s docker pull "$ensemble_image" >results/source-controls/ensemble.pull.txt 2>&1 || ensemble_status=$?
          if test "$native_status" -eq 0; then
            timeout --kill-after=5s 120s docker run --name "$native_container" --rm --pull never --network none -v "$PWD/payload/candidates/native:/test:ro" --entrypoint /usr/local/bin/python "$native_image" -I -S -B /test/test_model_json_boundary.py >results/source-controls/native.stdout.txt 2>results/source-controls/native.stderr.txt || native_status=$?
          fi
          cleanup_control "$native_container" results/source-controls/native || native_status=1
          if test "$ensemble_status" -eq 0; then
            timeout --kill-after=5s 120s docker run --name "$ensemble_container" --rm --pull never --network none -v "$PWD/payload/candidates/ensemble-v2:/test:ro" --entrypoint /usr/local/bin/python "$ensemble_image" -I -S -B /test/test_invented.py >results/source-controls/ensemble.stdout.txt 2>results/source-controls/ensemble.stderr.txt || ensemble_status=$?
          fi
          cleanup_control "$ensemble_container" results/source-controls/ensemble || ensemble_status=1
          printf '%s\n' "$native_status" >results/source-controls/native.exitcode.txt
          printf '%s\n' "$ensemble_status" >results/source-controls/ensemble.exitcode.txt
          cat results/source-controls/*.exitcode.txt results/source-controls/*.stderr.txt results/source-controls/*.inspect.txt
          test "$native_status" -eq 0 && test "$ensemble_status" -eq 0
      - name: Run actual final images on complete invented task rosters
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          native_status=0
          ensemble_status=0
          sudo -n /usr/bin/python3 -I -S -B payload/verify_linux.py --image ghcr.io/kouzhizhuo/agenthon-t4@sha256:cd4c53ae801cce08448de675005f6de959e22e048cb0c0ab3ddcddc5f2161173 --source payload/candidates/native --out results/native || native_status=$?
          sudo -n /usr/bin/python3 -I -S -B payload/verify_linux.py --image ghcr.io/kouzhizhuo/agenthon-t4@sha256:403f989984c2e23def605f382fbe83e5c5f5933d2d38249006e7e718822f2a98 --source payload/candidates/ensemble-v2 --out results/ensemble-v2 --ensemble || ensemble_status=$?
          test "$native_status" -eq 0 && test "$ensemble_status" -eq 0
      - name: Expose only invented verification receipts to artifact reader
        if: always()
        run: |
          if test -d "$GITHUB_WORKSPACE/results"; then sudo -n chmod -R a+rX -- "$GITHUB_WORKSPACE/results"; fi
      - name: Upload exact verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t4-task-driven-linux-${{ github.run_id }}
          path: |
            results
            payload/candidates/*/RUNTIME_MANIFEST.json
            payload/candidates/*/SOURCE_FREEZE.json
          retention-days: 7
